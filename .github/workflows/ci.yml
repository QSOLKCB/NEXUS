name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: 1.82.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Select Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
      - run: cargo test --locked
      - name: Browser model parity with Rust
        run: node tests/web.mjs
      - name: Stable checks
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo doc --locked --no-deps
          cargo test --locked --features gpu
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check site/app.mjs
          node --check site/view.mjs
          sha256sum -c MANIFEST.sha256
  formal:
    name: Lean proofs and Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Lean toolchain manager
        run: |
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Select Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check release binding, kernel proofs, axiom dependencies and live parity
        run: python3 -I scripts/check_formal.py
